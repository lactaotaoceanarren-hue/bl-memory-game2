<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai BL Pair Match</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Thai BL Pair Match</h1>
    <p class="subtitle">Match the names and pairs together!</p>

    <div class="stats">
      <div>Moves: <span id="moves">0</span></div>
      <div>Matches: <span id="matches">0</span> / 8</div>
    </div>

    <div class="game-board" id="gameBoard"></div>

    <button id="resetBtn" onclick="resetGame()">Restart Game</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
